services:

  # ============================================================
  # PostgreSQL
  # ============================================================

  postgres:
    image: postgres:16
    container_name: realtime-postgres
    hostname: postgres

    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-realtime_core}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-realtime_core}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - cluster-network


  # ============================================================
  # Kafka
  # ============================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    hostname: kafka-ui
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      JAVA_OPTS: "-Djava.security.krb5.conf=/var/lib/secret/krb5.conf"

      # Cluster 0: kafka-plain (SASL_PLAINTEXT / PLAIN)
      KAFKA_CLUSTERS_0_NAME: kafka-plain
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-plain:29092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: PLAIN
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret";'
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium-connect-plain
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect-plain:8083

      # Cluster 1: kafka-gssapi (SASL_PLAINTEXT / GSSAPI)
      KAFKA_CLUSTERS_1_NAME: kafka-gssapi
      KAFKA_CLUSTERS_1_BOOTSTRAPSERVERS: kafka-gssapi:29094
      KAFKA_CLUSTERS_1_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_CLUSTERS_1_PROPERTIES_SASL_MECHANISM: GSSAPI
      KAFKA_CLUSTERS_1_PROPERTIES_SASL_KERBEROS_SERVICE_NAME: kafka
      KAFKA_CLUSTERS_1_PROPERTIES_SASL_JAAS_CONFIG: 'com.sun.security.auth.module.Krb5LoginModule required useKeyTab=true storeKey=true keyTab="/var/lib/secret/client.keytab" principal="client@${KRB5_REALM:-EXAMPLE.COM}";'
      KAFKA_CLUSTERS_1_KAFKACONNECT_0_NAME: debezium-connect-gssapi
      KAFKA_CLUSTERS_1_KAFKACONNECT_0_ADDRESS: http://kafka-connect-gssapi:8083
    volumes:
      - kerberos-keytabs:/var/lib/secret:ro
    depends_on:
      kafka-plain:
        condition: service_healthy
      kafka-gssapi:
        condition: service_healthy
    networks:
      - cluster-network
    restart: unless-stopped

  # ============================================================
  # Kerberos KDC (for Kafka GSSAPI)
  # ============================================================

  kdc:
    image: alpine:latest
    container_name: kdc
    hostname: kdc
    ports:
      - "88:88/tcp"
      - "88:88/udp"
      - "749:749/tcp"
    environment:
      KRB5_REALM: ${KRB5_REALM:-EXAMPLE.COM}
      KRB5_KDC: ${KRB5_KDC:-kdc}
      SERVER_IP: ${SERVER_IP:-localhost}
    volumes:
      - ./security/krb5/init-kdc.sh:/usr/local/bin/init-kdc.sh:ro
      - kerberos-keytabs:/var/lib/secret
    command: ["/bin/sh", "/usr/local/bin/init-kdc.sh"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /var/lib/secret/kafka.keytab && test -f /var/lib/secret/client.keytab"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cluster-network
    restart: unless-stopped


  # ============================================================
  # Kafka Cluster 1: SASL_PLAINTEXT (PLAIN: Username & Password)
  # ============================================================

  kafka-plain:
    image: apache/kafka:3.9.1
    container_name: kafka-plain
    hostname: kafka-plain

    ports:
      - "${KAFKA_PLAIN_PORT:-${KAFKA_PORT:-9092}}:9092"

    environment:
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # KRaft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-plain:9093

      # Listeners
      KAFKA_LISTENERS: INTERNAL://kafka-plain:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka-plain:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-plain:29092,EXTERNAL://${SERVER_IP:-localhost}:${KAFKA_PLAIN_PORT:-${KAFKA_PORT:-9092}}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Security: SASL_PLAINTEXT / PLAIN
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf"

      # Single broker
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 6

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    volumes:
      - kafka-plain-data:/var/lib/kafka/data
      - ./security/plain:/etc/kafka/secrets:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 --command-config /etc/kafka/secrets/client.properties > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

    networks:
      cluster-network:
        aliases:
          - kafka


  # ============================================================
  # Kafka Cluster 2: SASL_PLAINTEXT (GSSAPI: Kerberos)
  # ============================================================

  kafka-gssapi:
    image: apache/kafka:3.9.1
    container_name: kafka-gssapi
    hostname: kafka-gssapi

    ports:
      - "${KAFKA_GSSAPI_PORT:-9094}:9094"

    depends_on:
      kdc:
        condition: service_healthy

    environment:
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # KRaft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-gssapi:9095

      # Listeners
      KAFKA_LISTENERS: INTERNAL://kafka-gssapi:29094,EXTERNAL://0.0.0.0:9094,CONTROLLER://kafka-gssapi:9095
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-gssapi:29094,EXTERNAL://${SERVER_IP:-localhost}:${KAFKA_GSSAPI_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Security: SASL_PLAINTEXT / GSSAPI (Kerberos)
      KAFKA_SASL_ENABLED_MECHANISMS: GSSAPI
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: GSSAPI
      KAFKA_SASL_KERBEROS_SERVICE_NAME: kafka
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf -Djava.security.krb5.conf=/var/lib/secret/krb5.conf"

      # Single broker
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 6

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    volumes:
      - kafka-gssapi-data:/var/lib/kafka/data
      - kerberos-keytabs:/var/lib/secret:ro
      - ./security/gssapi:/etc/kafka/secrets:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka-gssapi:29094 --command-config /etc/kafka/secrets/client.properties > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

    networks:
      - cluster-network


  # ============================================================
  # Kafka Connect 1 (for kafka-plain / rule_definitions CDC)
  # ============================================================

  kafka-connect-plain:
    image: quay.io/debezium/connect:3.0
    container_name: kafka-connect-plain
    hostname: kafka-connect-plain

    ports:
      - "${CONNECT_PLAIN_PORT:-8083}:8083"

    depends_on:
      kafka-plain:
        condition: service_healthy
      postgres:
        condition: service_healthy

    environment:
      BOOTSTRAP_SERVERS: kafka-plain:29092
      GROUP_ID: connect-plain-group

      CONFIG_STORAGE_TOPIC: connect-plain-configs
      OFFSET_STORAGE_TOPIC: connect-plain-offsets
      STATUS_STORAGE_TOPIC: connect-plain-status

      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      REST_ADVERTISED_HOST_NAME: kafka-connect-plain

      # SASL_PLAINTEXT / PLAIN Security Config
      CONNECT_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_SASL_MECHANISM: PLAIN
      CONNECT_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret";'

      CONNECT_PRODUCER_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_PRODUCER_SASL_MECHANISM: PLAIN
      CONNECT_PRODUCER_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret";'

      CONNECT_CONSUMER_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_CONSUMER_SASL_MECHANISM: PLAIN
      CONNECT_CONSUMER_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret";'

      CONNECT_ADMIN_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_ADMIN_SASL_MECHANISM: PLAIN
      CONNECT_ADMIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret";'

    networks:
      cluster-network:
        aliases:
          - kafka-connect
    restart: unless-stopped


  # ============================================================
  # Kafka Connect 2 (for kafka-gssapi / schema_definitions CDC)
  # ============================================================

  kafka-connect-gssapi:
    image: quay.io/debezium/connect:3.0
    container_name: kafka-connect-gssapi
    hostname: kafka-connect-gssapi

    ports:
      - "${CONNECT_GSSAPI_PORT:-8084}:8083"

    depends_on:
      kafka-gssapi:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kdc:
        condition: service_healthy

    environment:
      BOOTSTRAP_SERVERS: kafka-gssapi:29094
      GROUP_ID: connect-gssapi-group

      CONFIG_STORAGE_TOPIC: connect-gssapi-configs
      OFFSET_STORAGE_TOPIC: connect-gssapi-offsets
      STATUS_STORAGE_TOPIC: connect-gssapi-status

      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      REST_ADVERTISED_HOST_NAME: kafka-connect-gssapi

      # SASL_PLAINTEXT / GSSAPI (Kerberos) Security Config
      CONNECT_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_SASL_MECHANISM: GSSAPI
      CONNECT_SASL_KERBEROS_SERVICE_NAME: kafka
      CONNECT_SASL_JAAS_CONFIG: 'com.sun.security.auth.module.Krb5LoginModule required useKeyTab=true storeKey=true keyTab="/var/lib/secret/client.keytab" principal="client@${KRB5_REALM:-EXAMPLE.COM}";'

      CONNECT_PRODUCER_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_PRODUCER_SASL_MECHANISM: GSSAPI
      CONNECT_PRODUCER_SASL_KERBEROS_SERVICE_NAME: kafka
      CONNECT_PRODUCER_SASL_JAAS_CONFIG: 'com.sun.security.auth.module.Krb5LoginModule required useKeyTab=true storeKey=true keyTab="/var/lib/secret/client.keytab" principal="client@${KRB5_REALM:-EXAMPLE.COM}";'

      CONNECT_CONSUMER_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_CONSUMER_SASL_MECHANISM: GSSAPI
      CONNECT_CONSUMER_SASL_KERBEROS_SERVICE_NAME: kafka
      CONNECT_CONSUMER_SASL_JAAS_CONFIG: 'com.sun.security.auth.module.Krb5LoginModule required useKeyTab=true storeKey=true keyTab="/var/lib/secret/client.keytab" principal="client@${KRB5_REALM:-EXAMPLE.COM}";'

      CONNECT_ADMIN_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_ADMIN_SASL_MECHANISM: GSSAPI
      CONNECT_ADMIN_SASL_KERBEROS_SERVICE_NAME: kafka
      CONNECT_ADMIN_SASL_JAAS_CONFIG: 'com.sun.security.auth.module.Krb5LoginModule required useKeyTab=true storeKey=true keyTab="/var/lib/secret/client.keytab" principal="client@${KRB5_REALM:-EXAMPLE.COM}";'

      KAFKA_OPTS: "-Djava.security.krb5.conf=/var/lib/secret/krb5.conf"

    volumes:
      - kerberos-keytabs:/var/lib/secret:ro

    networks:
      - cluster-network
    restart: unless-stopped


  # ============================================================
  # Flink JobManager
  # ============================================================

  jobmanager:
    image: flink:1.20.5-scala_2.12-java17
    container_name: flink-jobmanager
    hostname: jobmanager

    ports:
      - "8081:8081"
      - "9249:9249"

    user: "root"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        ([ -f /opt/flink/plugins/metrics-prometheus/flink-metrics-prometheus-*.jar ] || [ -f /opt/flink/plugins/prometheus/flink-metrics-prometheus-*.jar ] || (mkdir -p /opt/flink/plugins/prometheus && wget -qO /opt/flink/plugins/prometheus/flink-metrics-prometheus-1.20.5.jar https://repo1.maven.org/maven2/org/apache/flink/flink-metrics-prometheus/1.20.5/flink-metrics-prometheus-1.20.5.jar)) &&
        chown -R flink:flink /opt/flink/checkpoints 2>/dev/null || true &&
        /docker-entrypoint.sh jobmanager

    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - kerberos-keytabs:/var/lib/secret:ro

    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager

        jobmanager.memory.process.size: 2048m

        env.java.opts.jobmanager: -Djava.security.krb5.conf=/var/lib/secret/krb5.conf

        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249

        metrics.latency.interval: 5000
        metrics.latency.history-size: 128

        execution.checkpointing.interval: 30s
        execution.checkpointing.mode: EXACTLY_ONCE

        state.backend.type: rocksdb
        state.backend.incremental: true
        state.checkpoint-storage: filesystem
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/checkpoints/savepoints

    depends_on:
      postgres:
        condition: service_healthy
      kafka-plain:
        condition: service_healthy
      kafka-gssapi:
        condition: service_healthy
      kdc:
        condition: service_healthy

    networks:
      - cluster-network


  # ============================================================
  # Flink TaskManager 1
  # ============================================================

  taskmanager-1:
    image: flink:1.20.5-scala_2.12-java17
    container_name: flink-taskmanager-1
    hostname: taskmanager-1

    ports:
      - "9250:9249"

    depends_on:
      - jobmanager

    user: "root"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        ([ -f /opt/flink/plugins/metrics-prometheus/flink-metrics-prometheus-*.jar ] || [ -f /opt/flink/plugins/prometheus/flink-metrics-prometheus-*.jar ] || (mkdir -p /opt/flink/plugins/prometheus && wget -qO /opt/flink/plugins/prometheus/flink-metrics-prometheus-1.20.5.jar https://repo1.maven.org/maven2/org/apache/flink/flink-metrics-prometheus/1.20.5/flink-metrics-prometheus-1.20.5.jar)) &&
        chown -R flink:flink /opt/flink/checkpoints 2>/dev/null || true &&
        /docker-entrypoint.sh taskmanager

    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - kerberos-keytabs:/var/lib/secret:ro

    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager

        taskmanager.numberOfTaskSlots: 2

        taskmanager.memory.process.size: 4096m

        env.java.opts.taskmanager: -Djava.security.krb5.conf=/var/lib/secret/krb5.conf

        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249

        metrics.latency.interval: 5000
        metrics.latency.history-size: 128

        state.backend.type: rocksdb
        state.backend.incremental: true
        state.checkpoint-storage: filesystem
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/checkpoints/savepoints

    networks:
      - cluster-network


  # ============================================================
  # Flink TaskManager 2
  # ============================================================

  taskmanager-2:
    image: flink:1.20.5-scala_2.12-java17
    container_name: flink-taskmanager-2
    hostname: taskmanager-2

    ports:
      - "9251:9249"

    depends_on:
      - jobmanager

    user: "root"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        ([ -f /opt/flink/plugins/metrics-prometheus/flink-metrics-prometheus-*.jar ] || [ -f /opt/flink/plugins/prometheus/flink-metrics-prometheus-*.jar ] || (mkdir -p /opt/flink/plugins/prometheus && wget -qO /opt/flink/plugins/prometheus/flink-metrics-prometheus-1.20.5.jar https://repo1.maven.org/maven2/org/apache/flink/flink-metrics-prometheus/1.20.5/flink-metrics-prometheus-1.20.5.jar)) &&
        chown -R flink:flink /opt/flink/checkpoints 2>/dev/null || true &&
        /docker-entrypoint.sh taskmanager

    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
      - kerberos-keytabs:/var/lib/secret:ro

    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager

        taskmanager.numberOfTaskSlots: 2

        taskmanager.memory.process.size: 4096m

        env.java.opts.taskmanager: -Djava.security.krb5.conf=/var/lib/secret/krb5.conf

        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249

        metrics.latency.interval: 5000
        metrics.latency.history-size: 128

        state.backend.type: rocksdb
        state.backend.incremental: true
        state.checkpoint-storage: filesystem
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/checkpoints/savepoints

    networks:
      - cluster-network


  # ============================================================
  # Prometheus
  # ============================================================

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    hostname: prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    depends_on:
      - jobmanager
    networks:
      - cluster-network
    restart: unless-stopped


  # ============================================================
  # Grafana
  # ============================================================

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    hostname: grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - cluster-network
    restart: unless-stopped


# ================================================================
# Volumes
# ================================================================

volumes:

  postgres-data:
    name: realtime-postgres-data

  kafka-plain-data:
    name: realtime-kafka-plain-data

  kafka-gssapi-data:
    name: realtime-kafka-gssapi-data

  kerberos-keytabs:
    name: realtime-kerberos-keytabs

  flink-checkpoints:
    name: realtime-flink-checkpoints

  prometheus-data:
    name: realtime-prometheus-data

  grafana-data:
    name: realtime-grafana-data


# ================================================================
# Network
# ================================================================

networks:
  cluster-network: