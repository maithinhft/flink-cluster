services:

  # ============================================================
  # PostgreSQL
  # ============================================================

  postgres:
    image: postgres:16
    container_name: realtime-postgres
    hostname: postgres

    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-realtime_core}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-realtime_core}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - cluster-network


  # ============================================================
  # Kafka
  # ============================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    hostname: kafka-ui
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: flink-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:${CONNECT_PORT:-8083}
      DYNAMIC_CONFIG_ENABLED: true
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - cluster-network
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    hostname: kafka

    ports:
      - "${KAFKA_PORT:-9092}:9092"

    environment:

      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # KRaft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Listeners
      KAFKA_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${SERVER_IP:-localhost}:${KAFKA_PORT:-9092}

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Single broker
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 6

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10

    networks:
      - cluster-network


  # ============================================================
  # Kafka Connect + Debezium
  # ============================================================

  kafka-connect:
    image: quay.io/debezium/connect:3.0
    container_name: kafka-connect
    hostname: kafka-connect

    ports:
      - "8083:8083"

    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

    environment:

      BOOTSTRAP_SERVERS: kafka:29092

      GROUP_ID: 1

      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status

      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      REST_ADVERTISED_HOST_NAME: kafka-connect

    networks:
      - cluster-network


  # ============================================================
  # Flink JobManager
  # ============================================================

  jobmanager:
    image: flink:1.20.5-scala_2.12-java17
    container_name: flink-jobmanager
    hostname: jobmanager

    ports:
      - "8081:8081"
      - "9249:9249"

    command: >
      bash -c "
      mkdir -p /opt/flink/plugins/prometheus &&
      wget -qO /opt/flink/plugins/prometheus/flink-metrics-prometheus-1.20.5.jar
      https://repo1.maven.org/maven2/org/apache/flink/flink-metrics-prometheus/1.20.5/flink-metrics-prometheus-1.20.5.jar &&
      /docker-entrypoint.sh jobmanager
      "

    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager

        jobmanager.memory.process.size: 2048m

        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249

        metrics.latency.interval: 5000
        metrics.latency.history-size: 128

        execution.checkpointing.interval: 30s
        execution.checkpointing.mode: EXACTLY_ONCE

    depends_on:
      kafka:
        condition: service_healthy

    networks:
      - cluster-network


  # ============================================================
  # Flink TaskManager 1
  # ============================================================

  taskmanager-1:
    image: flink:1.20.5-scala_2.12-java17
    container_name: flink-taskmanager-1
    hostname: taskmanager-1

    ports:
      - "9250:9249"

    depends_on:
      - jobmanager

    command: >
      bash -c "
      mkdir -p /opt/flink/plugins/prometheus &&
      wget -qO /opt/flink/plugins/prometheus/flink-metrics-prometheus-1.20.5.jar
      https://repo1.maven.org/maven2/org/apache/flink/flink-metrics-prometheus/1.20.5/flink-metrics-prometheus-1.20.5.jar &&
      /docker-entrypoint.sh taskmanager
      "

    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager

        taskmanager.numberOfTaskSlots: 2

        taskmanager.memory.process.size: 4096m

        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249

        metrics.latency.interval: 5000
        metrics.latency.history-size: 128

    networks:
      - cluster-network


  # ============================================================
  # Flink TaskManager 2
  # ============================================================

  taskmanager-2:
    image: flink:1.20.5-scala_2.12-java17
    container_name: flink-taskmanager-2
    hostname: taskmanager-2

    ports:
      - "9251:9249"

    depends_on:
      - jobmanager

    command: >
      bash -c "
      mkdir -p /opt/flink/plugins/prometheus &&
      wget -qO /opt/flink/plugins/prometheus/flink-metrics-prometheus-1.20.5.jar
      https://repo1.maven.org/maven2/org/apache/flink/flink-metrics-prometheus/1.20.5/flink-metrics-prometheus-1.20.5.jar &&
      /docker-entrypoint.sh taskmanager
      "

    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager

        taskmanager.numberOfTaskSlots: 2

        taskmanager.memory.process.size: 4096m

        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249

        metrics.latency.interval: 5000
        metrics.latency.history-size: 128

    networks:
      - cluster-network


# ================================================================
# Volumes
# ================================================================

volumes:

  postgres-data:
    name: realtime-postgres-data

  kafka-data:
    name: realtime-kafka-data


# ================================================================
# Network
# ================================================================

networks:
  cluster-network: